<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!--
    PortfoliOS program icons. All symbols share a 32x32 grid and use integer
    coordinates with crispEdges so they stay pixel-sharp at 16px and 32px.
  -->

  <symbol id="icon-about" viewBox="0 0 32 32" shape-rendering="crispEdges">
    <rect x="4" y="3" width="24" height="26" fill="#fff" stroke="#000" stroke-width="1"/>
    <rect x="4" y="3" width="24" height="4" fill="#000080"/>
    <circle cx="16" cy="15" r="5" fill="#f0c090" stroke="#000" stroke-width="1"/>
    <path d="M8 27c0-5 3.5-7 8-7s8 2 8 7z" fill="#0a5fc0" stroke="#000" stroke-width="1"/>
  </symbol>

  <symbol id="icon-projects" viewBox="0 0 32 32" shape-rendering="crispEdges">
    <path d="M3 7h10l3 3h13v18H3z" fill="#ffd020" stroke="#000" stroke-width="1"/>
    <path d="M3 12h26v16H3z" fill="#ffe680" stroke="#000" stroke-width="1"/>
    <rect x="6" y="16" width="14" height="1" fill="#c08000"/>
    <rect x="6" y="19" width="18" height="1" fill="#c08000"/>
    <rect x="6" y="22" width="11" height="1" fill="#c08000"/>
  </symbol>

  <symbol id="icon-experience" viewBox="0 0 32 32" shape-rendering="crispEdges">
    <rect x="11" y="5" width="10" height="5" fill="none" stroke="#000" stroke-width="2"/>
    <rect x="2" y="9" width="28" height="19" fill="#8b5a2b" stroke="#000" stroke-width="1"/>
    <rect x="2" y="16" width="28" height="3" fill="#5c3a1a"/>
    <rect x="13" y="15" width="6" height="5" fill="#ffd020" stroke="#000" stroke-width="1"/>
  </symbol>

  <symbol id="icon-skills" viewBox="0 0 32 32" shape-rendering="crispEdges">
    <rect x="3" y="20" width="6" height="9" fill="#0a5fc0" stroke="#000" stroke-width="1"/>
    <rect x="11" y="13" width="6" height="16" fill="#00a000" stroke="#000" stroke-width="1"/>
    <rect x="19" y="7" width="6" height="22" fill="#ffd020" stroke="#000" stroke-width="1"/>
    <rect x="2" y="29" width="28" height="1" fill="#000"/>
  </symbol>

  <symbol id="icon-contact" viewBox="0 0 32 32" shape-rendering="crispEdges">
    <rect x="2" y="7" width="28" height="19" fill="#fff" stroke="#000" stroke-width="1"/>
    <path d="M2 7l14 11L30 7" fill="none" stroke="#000" stroke-width="1"/>
    <path d="M2 26l10-9M30 26l-10-9" fill="none" stroke="#808080" stroke-width="1"/>
  </symbol>

  <symbol id="icon-solitaire" viewBox="0 0 32 32" shape-rendering="crispEdges">
    <rect x="3" y="6" width="15" height="21" fill="#fff" stroke="#000" stroke-width="1"/>
    <rect x="12" y="4" width="16" height="22" fill="#fff" stroke="#000" stroke-width="1"/>
    <path d="M20 9l4 6h-8z" fill="#d00000"/>
    <path d="M20 21l-4-6h8z" fill="#000"/>
  </symbol>

  <!-- Envelope with a motion streak, as on the Outlook Express Send button. -->
  <symbol id="icon-send" viewBox="0 0 32 32" shape-rendering="crispEdges">
    <rect x="9" y="8" width="21" height="15" fill="#fff" stroke="#000" stroke-width="1"/>
    <path d="M9 8l10.5 8L30 8" fill="none" stroke="#000" stroke-width="1"/>
    <rect x="1" y="11" width="6" height="2" fill="#0a5fc0"/>
    <rect x="3" y="15" width="4" height="2" fill="#0a5fc0"/>
    <rect x="1" y="19" width="6" height="2" fill="#0a5fc0"/>
  </symbol>

  <symbol id="icon-shutdown" viewBox="0 0 32 32" shape-rendering="crispEdges">
    <circle cx="16" cy="18" r="10" fill="none" stroke="#000" stroke-width="3"/>
    <rect x="14" y="3" width="4" height="14" fill="#000"/>
    <rect x="15" y="4" width="2" height="12" fill="#d00000"/>
  </symbol>

  <!-- Start button logo: the four-pane flag, skewed like the original. -->
  <symbol id="icon-logo" viewBox="0 0 32 32" shape-rendering="crispEdges">
    <path d="M3 8l12-3v11L3 17z" fill="#d00000"/>
    <path d="M17 4.5l12-3v13l-12 1z" fill="#00a000"/>
    <path d="M3 19l12-1v11l-12-3z" fill="#0a5fc0"/>
    <path d="M17 17.5l12-1v13l-12-3z" fill="#ffd020"/>
  </symbol>

  <!-- resume.exe: a document with a download arrow. -->
  <symbol id="icon-resume" viewBox="0 0 32 32" shape-rendering="crispEdges">
    <path d="M5 2h13l6 6v22H5z" fill="#fff" stroke="#000" stroke-width="1"/>
    <path d="M18 2v6h6" fill="#dfdfdf" stroke="#000" stroke-width="1"/>
    <rect x="8" y="12" width="12" height="1" fill="#808080"/>
    <rect x="8" y="15" width="12" height="1" fill="#808080"/>
    <rect x="8" y="18" width="8" height="1" fill="#808080"/>
    <path d="M22 17h6v7h4l-7 7-7-7h4z" fill="#00a000" stroke="#000" stroke-width="1"/>
  </symbol>

  <!-- Programs launched from files in the Projects explorer. -->

  <symbol id="icon-notepad" viewBox="0 0 32 32" shape-rendering="crispEdges">
    <rect x="6" y="5" width="20" height="24" fill="#fff" stroke="#000" stroke-width="1"/>
    <rect x="6" y="5" width="20" height="4" fill="#0a5fc0"/>
    <rect x="9" y="3" width="2" height="4" fill="#808080"/>
    <rect x="13" y="3" width="2" height="4" fill="#808080"/>
    <rect x="17" y="3" width="2" height="4" fill="#808080"/>
    <rect x="21" y="3" width="2" height="4" fill="#808080"/>
    <rect x="9" y="13" width="14" height="1" fill="#808080"/>
    <rect x="9" y="16" width="14" height="1" fill="#808080"/>
    <rect x="9" y="19" width="10" height="1" fill="#808080"/>
    <rect x="9" y="22" width="14" height="1" fill="#808080"/>
  </symbol>

  <symbol id="icon-photos" viewBox="0 0 32 32" shape-rendering="crispEdges">
    <rect x="3" y="5" width="26" height="22" fill="#8b5a2b" stroke="#000" stroke-width="1"/>
    <rect x="6" y="8" width="20" height="16" fill="#8fc8ff" stroke="#000" stroke-width="1"/>
    <rect x="6" y="18" width="20" height="6" fill="#00a000"/>
    <path d="M9 18l5-6 5 6z" fill="#008000"/>
    <rect x="19" y="10" width="4" height="4" fill="#ffd020"/>
  </symbol>

  <symbol id="icon-media" viewBox="0 0 32 32" shape-rendering="crispEdges">
    <rect x="3" y="4" width="26" height="19" fill="#c0c0c0" stroke="#000" stroke-width="1"/>
    <rect x="6" y="7" width="20" height="13" fill="#000"/>
    <path d="M13 10l8 4-8 4z" fill="#00a000"/>
    <rect x="12" y="23" width="8" height="2" fill="#808080"/>
    <rect x="8" y="25" width="16" height="3" fill="#c0c0c0" stroke="#000" stroke-width="1"/>
  </symbol>

  <!-- File types shown inside a project folder. Same dog-eared page each time. -->

  <symbol id="icon-file-txt" viewBox="0 0 32 32" shape-rendering="crispEdges">
    <path d="M7 2h13l6 6v22H7z" fill="#fff" stroke="#000" stroke-width="1"/>
    <path d="M20 2v6h6" fill="#dfdfdf" stroke="#000" stroke-width="1"/>
    <rect x="10" y="12" width="12" height="1" fill="#808080"/>
    <rect x="10" y="15" width="12" height="1" fill="#808080"/>
    <rect x="10" y="18" width="8" height="1" fill="#808080"/>
    <rect x="10" y="21" width="12" height="1" fill="#808080"/>
    <rect x="10" y="24" width="6" height="1" fill="#808080"/>
  </symbol>

  <symbol id="icon-file-jpg" viewBox="0 0 32 32" shape-rendering="crispEdges">
    <path d="M7 2h13l6 6v22H7z" fill="#fff" stroke="#000" stroke-width="1"/>
    <path d="M20 2v6h6" fill="#dfdfdf" stroke="#000" stroke-width="1"/>
    <rect x="10" y="11" width="12" height="14" fill="#8fc8ff" stroke="#000" stroke-width="1"/>
    <rect x="10" y="20" width="12" height="5" fill="#00a000"/>
    <rect x="17" y="13" width="3" height="3" fill="#ffd020"/>
  </symbol>

  <symbol id="icon-file-mp4" viewBox="0 0 32 32" shape-rendering="crispEdges">
    <path d="M7 2h13l6 6v22H7z" fill="#fff" stroke="#000" stroke-width="1"/>
    <path d="M20 2v6h6" fill="#dfdfdf" stroke="#000" stroke-width="1"/>
    <rect x="10" y="11" width="12" height="14" fill="#000"/>
    <rect x="11" y="13" width="1" height="1" fill="#fff"/>
    <rect x="11" y="16" width="1" height="1" fill="#fff"/>
    <rect x="11" y="19" width="1" height="1" fill="#fff"/>
    <rect x="11" y="22" width="1" height="1" fill="#fff"/>
    <path d="M14 14l6 4-6 4z" fill="#00a000"/>
  </symbol>

  <symbol id="icon-file-url" viewBox="0 0 32 32" shape-rendering="crispEdges">
    <path d="M7 2h13l6 6v22H7z" fill="#fff" stroke="#000" stroke-width="1"/>
    <path d="M20 2v6h6" fill="#dfdfdf" stroke="#000" stroke-width="1"/>
    <circle cx="16" cy="18" r="6" fill="#0a5fc0" stroke="#000" stroke-width="1"/>
    <rect x="10" y="17" width="12" height="1" fill="#8fc8ff"/>
    <rect x="15" y="12" width="1" height="12" fill="#8fc8ff"/>
  </symbol>
</svg>
