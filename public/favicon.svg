<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- PortfoliOS: a beige CRT with a white P on a teal screen. Thick strokes
       so the P survives being drawn at 16x16 in a browser tab. -->
  <!-- case -->
  <rect x="1" y="1" width="30" height="23" fill="#000"/>
  <rect x="2" y="2" width="28" height="21" fill="#d8cfa8"/>
  <rect x="2" y="2" width="28" height="1" fill="#f4eed6"/>
  <rect x="2" y="2" width="1" height="21" fill="#f4eed6"/>
  <rect x="2" y="22" width="28" height="1" fill="#9c9370"/>
  <rect x="29" y="2" width="1" height="21" fill="#9c9370"/>
  <!-- screen -->
  <rect x="4" y="4" width="24" height="17" fill="#004040"/>
  <rect x="5" y="5" width="22" height="15" fill="#008080"/>
  <!-- P -->
  <rect x="11" y="6" width="4" height="13" fill="#fff"/>
  <rect x="15" y="6" width="5" height="3" fill="#fff"/>
  <rect x="15" y="11" width="5" height="3" fill="#fff"/>
  <rect x="19" y="7" width="3" height="6" fill="#fff"/>
  <!-- stand -->
  <rect x="11" y="24" width="10" height="3" fill="#000"/>
  <rect x="12" y="24" width="8" height="2" fill="#9c9370"/>
  <rect x="6" y="27" width="20" height="4" fill="#000"/>
  <rect x="7" y="28" width="18" height="2" fill="#d8cfa8"/>
</svg>
